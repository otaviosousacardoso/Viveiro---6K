<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Viveiro — berçário de ideias</title>

  <link rel="stylesheet" href="src/estilo.css">
</head>

<body>

<header>

  <div class="marca">
    <h1>Viveiro</h1>
    <span class="lema">
      onde as ideias crescem antes de virar projeto
    </span>
  </div>

  <div class="sessao">
    <label for="quem">navegando como</label>
    <select id="quem"></select>
  </div>

</header>


<nav class="abas">

  <button id="aba-mural" class="aba ativa">
    Mural
  </button>

  <button id="aba-grupos" class="aba">
    Grupos
  </button>

</nav>


<main>

  <!-- ================= MURAL ================= -->

  <section id="mural">

    <div class="barra">

      <input
        id="busca"
        type="search"
        placeholder="buscar por título ou resumo..."
      >

      <span id="contagem" class="contagem"></span>

    </div>


    <p id="filtro-ativo" class="filtro-ativo"></p>


    <div id="cartoes" class="cartoes"></div>

  </section>


  <!-- ================= GRUPOS ================= -->

  <section id="grupos" class="escondido">

    <h2>Grupos</h2>

    <ul id="lista-grupos" class="lista-grupos"></ul>

  </section>


  <!-- ================= PÁGINA DA PESSOA ================= -->

  <section id="pagina-pessoa" class="escondido">

    <button
      id="voltar-pessoa"
      class="voltar"
    >
      ← voltar para o mural
    </button>

    <div id="conteudo-pessoa"></div>

  </section>


  <!-- ================= PÁGINA DA IDEIA ================= -->

  <section id="pagina-ideia" class="escondido">

    <button
      id="voltar-ideia"
      class="voltar"
    >
      ← voltar para o mural
    </button>

    <div id="conteudo-ideia"></div>

  </section>

</main>


<footer>

  <span>
    Viveiro — versão 0.1 (MVP)
  </span>

  <span
    id="base"
    class="base"
  ></span>

</footer>


<!-- IMPORTANTE:
     Primeiro carrega os dados.
     Depois carrega o app.
-->

<script src="dados/dados_K.js"></script>
<script src="src/app.js"></script>

</body>
</html>
